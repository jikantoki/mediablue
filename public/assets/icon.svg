<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0c0f14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(0, 210, 255, 0.25)" stroke-width="4"/>

  <!-- Outer Sound Waves / Bluetooth Signal Rings -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" opacity="0.65">
    <path d="M 120 180 A 160 160 0 0 1 392 180"/>
    <path d="M 80 140 A 210 210 0 0 1 432 140" opacity="0.4"/>
  </g>

  <!-- Stylized Car Silhouette -->
  <g filter="url(#glow)">
    <!-- Car Body -->
    <path d="M 96 340 
             L 110 290 
             C 125 240, 165 220, 210 215 
             L 302 215 
             C 347 220, 387 240, 402 290 
             L 416 340 
             C 424 340, 432 348, 432 358 
             L 432 384 
             C 432 392, 426 398, 418 398 
             L 404 398 
             L 404 380 
             L 108 380 
             L 108 398 
             L 94 398 
             C 86 398, 80 392, 80 384 
             L 80 358 
             C 80 348, 88 340, 96 340 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linejoin="round"/>

    <!-- Windshield -->
    <path d="M 148 285 
             C 160 250, 185 240, 220 238 
             L 292 238 
             C 327 240, 352 250, 364 285 Z" 
          fill="rgba(0, 210, 255, 0.2)" stroke="url(#accentGrad)" stroke-width="10"/>

    <!-- Headlights -->
    <ellipse cx="140" cy="330" rx="22" ry="12" fill="#00d2ff"/>
    <ellipse cx="372" cy="330" rx="22" ry="12" fill="#00d2ff"/>

    <!-- Wheels -->
    <rect x="120" y="375" width="44" height="20" rx="8" fill="#38bdf8"/>
    <rect x="348" y="375" width="44" height="20" rx="8" fill="#38bdf8"/>
  </g>

  <!-- Bluetooth Symbol in Center -->
  <g transform="translate(256, 175) scale(1.6)" filter="url(#glow)">
    <path d="M -7 -18 L 7 -4 L -3 5 L -3 -22 L 7 -13 L -7 1" 
          fill="none" stroke="#00d2ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
