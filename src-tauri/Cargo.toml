[package]
name = "mediablue"
version = "2.1.0"
description = "Mediablue - A2DP Sink & HFP car media client (Tauri / WebKitGTK)"
authors = ["jikantoki"]
edition = "2021"
license = "MIT"
repository = "https://github.com/jikantoki/mediablue"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# 配布サイズを小さくするためのリリースビルド設定
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
