<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Mediablue</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f17;color:#e6edf3;font-family:system-ui,sans-serif}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;padding:24px;box-sizing:border-box;text-align:center}
  h1{font-size:22px;margin:0}
  pre{white-space:pre-wrap;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 16px;max-width:720px;text-align:left;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mediablue を起動できませんでした</h1>
  <pre id="msg"></pre>
</div>
<script>
  document.getElementById('msg').textContent =
    decodeURIComponent(location.hash.slice(1)) || '不明なエラー';
</script>
</body>
</html>
