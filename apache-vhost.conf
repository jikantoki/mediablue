<VirtualHost *:12080>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        # 既存のファイルやディレクトリでない場合は index.php にルーティング
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/mediablue_error.log
    CustomLog ${APACHE_LOG_DIR}/mediablue_access.log combined
</VirtualHost>
